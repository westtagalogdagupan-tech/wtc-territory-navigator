<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WTC Territory Navigator</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body{
  margin:0;
  height:100%;
}
#map{
  width:100%;
  height:100%;
}
#banner{
  position:absolute;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  background:white;
  padding:8px 14px;
  border-radius:12px;
  font-family:Arial,sans-serif;
  font-weight:bold;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
  z-index:1000;
}
</style>
</head>

<body>

<div id="banner">Loading...</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
window.onload = function(){

  const map = L.map("map").setView([16.265852,120.409395],16);

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution:"© OpenStreetMap"
    }
  ).addTo(map);

  const territory =
    new URLSearchParams(window.location.search).get("territory") || "ALL";

  document.getElementById("banner").textContent = "📍 " + territory;

  let me = null;

  navigator.geolocation.watchPosition(function(pos){

      const p=[pos.coords.latitude,pos.coords.longitude];

      if(me){
        me.setLatLng(p);
      }else{
        me=L.circleMarker(p,{
          radius:8,
          color:"#2563EB",
          fillColor:"#2563EB",
          fillOpacity:1
        }).addTo(map);
      }

  });

};
</script>

</body>
</html>
