<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>WTC Territory Navigator</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<style>
html,body,#map{
height:100%;
margin:0;
font-family:Arial,sans-serif;
}

#status{
position:absolute;
top:12px;
left:55px;
z-index:1000;
background:white;
padding:10px 14px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.25);
font-weight:bold;
}

.fab{
position:absolute;
right:15px;
width:56px;
height:56px;
border:none;
border-radius:50%;
background:#2563EB;
color:white;
font-size:22px;
box-shadow:0 4px 12px rgba(0,0,0,.35);
cursor:pointer;
z-index:1000;
}

#followBtn{bottom:90px;display:none;}
#nextBtn{bottom:160px;}
#territoryBtn{bottom:230px;}

.house-marker{
width:28px;
height:28px;
background:#DC2626;
color:white;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
border:2px solid white;
box-shadow:0 2px 6px rgba(0,0,0,.4);
}
</style>
</head>

<body>

<div id="map"></div>

<div id="status">Loading territory...</div>

<button id="territoryBtn" class="fab">🏠</button>
<button id="nextBtn" class="fab">➡️</button>
<button id="followBtn" class="fab">📍</button>

<script>

// ---------------- CONFIG ----------------

const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSb2166VYuLVnakRbv1zBaA_GT5WhZhRpMRELIzktsQBUDSPY8J_2u0BJMJKyjy9XBGnZaNm_Iotlxu/pub?gid=150380614&single=true&output=csv";

// Get territory from AppSheet URL
const params=new URLSearchParams(window.location.search);
const territoryNumber=params.get("territory");
const territoryID=territoryNumber
? "T"+territoryNumber.padStart(3,"0")
: null;

// ---------------- MAP ----------------

const map=L.map("map").setView([16.043,120.334],14);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:20,
attribution:"© OpenStreetMap"
}
).addTo(map);

// ---------------- USER LOCATION ----------------

let userMarker=null;
let accuracyCircle=null;
let followMe=true;
let lastLocation=null;

const followBtn=document.getElementById("followBtn");

map.on("dragstart",()=>{
followMe=false;
followBtn.style.display="block";
});

followBtn.onclick=()=>{
followMe=true;
followBtn.style.display="none";
if(lastLocation) map.flyTo(lastLocation,18);
};

map.locate({
watch:true,
enableHighAccuracy:true,
setView:false,
maximumAge:0
});

map.on("locationfound",e=>{

lastLocation=e.latlng;

if(!userMarker){

userMarker=L.circleMarker(e.latlng,{
radius:8,
color:"#2563EB",
fillColor:"#2563EB",
fillOpacity:1
}).addTo(map);

accuracyCircle=L.circle(e.latlng,{
radius:e.accuracy,
color:"#2563EB",
fillColor:"#2563EB",
fillOpacity:.12,
weight:1
}).addTo(map);

}else{

userMarker.setLatLng(e.latlng);
accuracyCircle.setLatLng(e.latlng);
accuracyCircle.setRadius(e.accuracy);

}

if(followMe){
map.flyTo(e.latlng,18,{
animate:true,
duration:.5
});
}

if(houses.length){

const h=findNearestHouse(e.latlng.lat,e.latlng.lng);

if(h) h.marker.openPopup();

}

});

// ---------------- HOUSES ----------------

const houses=[];
let currentHouse=0;
let territoryBounds=null;

// Distance helper

function distance(lat1,lon1,lat2,lon2){

const R=6371000;

const dLat=(lat2-lat1)*Math.PI/180;
const dLon=(lon2-lon1)*Math.PI/180;

const a=
Math.sin(dLat/2)**2+
Math.cos(lat1*Math.PI/180)*
Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)**2;

return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));

}

function findNearestHouse(lat,lng){

let best=null;
let bestDist=Infinity;

houses.forEach((h,i)=>{

const d=distance(lat,lng,h.lat,h.lng);

if(d<bestDist){

bestDist=d;
best=h;
currentHouse=i;

}

});

return best;

}

// ---------------- LOAD PEOPLE ----------------

Papa.parse(CSV_URL,{
download:true,
header:true,
skipEmptyLines:true,

complete:function(result){

let bounds=[];
let count=0;

result.data.forEach(row=>{

if(territoryID && (row.TerritoryID||"").trim()!==territoryID)
return;

const coord=(row.Coordinates||"").replace(/"/g,"").trim();

const p=coord.split(",");

if(p.length!==2)return;

const lat=parseFloat(p[0]);
const lng=parseFloat(p[1]);

if(isNaN(lat)||isNaN(lng))return;

count++;

const marker=L.marker([lat,lng],{

icon:L.divIcon({

className:"",
html:`<div class="house-marker">${count}</div>`,
iconSize:[28,28],
iconAnchor:[14,14]

})

}).addTo(map);

marker.bindPopup(`
<b>${count}. ${row["Full Name"]||"House"}</b><br>
${row.Address||""}<br><br>
<button onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}')">
Navigate
</button>
`);

houses.push({
marker,
lat,
lng,
name:row["Full Name"],
address:row.Address
});

bounds.push([lat,lng]);

});

if(bounds.length){

territoryBounds=L.latLngBounds(bounds);

map.fitBounds(territoryBounds,{
padding:[40,40]
});

document.getElementById("status").innerHTML=
territoryNumber
? `Territory ${territoryNumber} • ${count} houses`
: `All Territories • ${count} houses`;

}else{

document.getElementById("status").innerHTML=
territoryNumber
? `No houses found for ${territoryID}`
: "No territory selected";

}

},

error:function(err){

console.error(err);

document.getElementById("status").innerHTML=
"Failed to load Google Sheet";

}

});

// ---------------- BUTTONS ----------------

document.getElementById("territoryBtn").onclick=()=>{

if(territoryBounds){

followMe=false;
followBtn.style.display="block";

map.fitBounds(territoryBounds,{
padding:[40,40]
});

}

};

document.getElementById("nextBtn").onclick=()=>{

if(!houses.length)return;

currentHouse++;

if(currentHouse>=houses.length)
currentHouse=0;

const h=houses[currentHouse];

followMe=false;
followBtn.style.display="block";

map.flyTo([h.lat,h.lng],19);

h.marker.openPopup();

};

</script>

</body>
</html>
