<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>WTC Territory Navigator</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<style>

html,body,#map{
height:100%;
margin:0;
font-family:Arial,sans-serif;
}

#status{
position:absolute;
top:12px;
left:50%;
transform:translateX(-50%);
z-index:1000;
background:white;
padding:10px 16px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.25);
font-weight:bold;
text-align:center;
}

.fab{
position:absolute;
right:15px;
width:56px;
height:56px;
border:none;
border-radius:50%;
background:#2563EB;
color:white;
font-size:22px;
box-shadow:0 4px 12px rgba(0,0,0,.35);
cursor:pointer;
z-index:1000;
}

#followBtn{bottom:90px;display:none;}
#nextBtn{bottom:160px;}
#territoryBtn{bottom:230px;}

.house{
width:28px;
height:28px;
background:#DC2626;
color:white;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
border:2px solid white;
box-shadow:0 2px 6px rgba(0,0,0,.35);
}

.visited{
background:#9CA3AF;
}

.target{
background:#16A34A;
}

.popup-btn{
margin-top:8px;
padding:8px 10px;
border:none;
border-radius:8px;
background:#2563EB;
color:white;
cursor:pointer;
}

.popup-btn.gray{
background:#6B7280;
}

</style>
</head>

<body>

<div id="map"></div>

<div id="status">Loading territory...</div>

<button id="territoryBtn" class="fab">🏠</button>
<button id="nextBtn" class="fab">➡️</button>
<button id="followBtn" class="fab">📍</button>

<script>

// ================= CONFIG =================

const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSb2166VYuLVnakRbv1zBaA_GT5WhZhRpMRELIzktsQBUDSPY8J_2u0BJMJKyjy9XBGnZaNm_Iotlxu/pub?gid=150380614&single=true&output=csv";

const params=new URLSearchParams(location.search);

const territoryNumber=params.get("territory");

const territoryID=territoryNumber
?`T${territoryNumber.padStart(3,"0")}`
:null;

// ================= STORAGE =================

const STORAGE_KEY=`visited_${territoryID||"ALL"}`;

const visited=new Set(
JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]")
);

// ================= MAP =================

const map=L.map("map").setView([16.043,120.334],14);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:20,
attribution:"© OpenStreetMap"
}
).addTo(map);

// ================= GPS =================

let userMarker;
let accuracyCircle;
let follow=true;
let lastLocation;

const followBtn=document.getElementById("followBtn");

map.on("dragstart",()=>{

follow=false;
followBtn.style.display="block";

});

followBtn.onclick=()=>{

follow=true;
followBtn.style.display="none";

if(lastLocation)
map.flyTo(lastLocation,18);

};

map.locate({
watch:true,
enableHighAccuracy:true,
maximumAge:0
});

map.on("locationfound",e=>{

lastLocation=e.latlng;

if(!userMarker){

userMarker=L.circleMarker(e.latlng,{
radius:8,
color:"#2563EB",
fillColor:"#2563EB",
fillOpacity:1
}).addTo(map);

accuracyCircle=L.circle(e.latlng,{
radius:e.accuracy,
color:"#2563EB",
fillColor:"#2563EB",
fillOpacity:.12,
weight:1
}).addTo(map);

}else{

userMarker.setLatLng(e.latlng);
accuracyCircle.setLatLng(e.latlng);
accuracyCircle.setRadius(e.accuracy);

}

if(follow)
map.flyTo(e.latlng,18,{
animate:true,
duration:.5
});

highlightNearest();

});

// ================= HOUSES =================

const houses=[];
let current=0;
let territoryBounds;

// Distance

function distance(a,b,c,d){

const R=6371000;

const dLat=(c-a)*Math.PI/180;
const dLon=(d-b)*Math.PI/180;

const aa=
Math.sin(dLat/2)**2+
Math.cos(a*Math.PI/180)*
Math.cos(c*Math.PI/180)*
Math.sin(dLon/2)**2;

return R*2*Math.atan2(Math.sqrt(aa),Math.sqrt(1-aa));

}

// Marker

function createIcon(num,state){

return L.divIcon({

className:"",

html:`<div class="house ${state}">
${num}
</div>`,

iconSize:[28,28],
iconAnchor:[14,14]

});

}

// Save

function saveVisited(){

localStorage.setItem(
STORAGE_KEY,
JSON.stringify([...visited])
);

}

// Highlight nearest

function highlightNearest(){

if(!lastLocation||!houses.length)return;

let best=-1;
let bestDist=Infinity;

houses.forEach((h,i)=>{

if(visited.has(h.id))return;

const d=distance(
lastLocation.lat,
lastLocation.lng,
h.lat,
h.lng
);

if(d<bestDist){

best=i;
bestDist=d;

}

});

if(best==-1)return;

houses.forEach(h=>{

const state=visited.has(h.id)
?"visited":"";

h.marker.setIcon(
createIcon(h.number,state)
);

});

const h=houses[best];

h.marker.setIcon(
createIcon(h.number,"target")
);

current=best;

h.marker.openPopup();

}

// ================= LOAD PEOPLE =================

Papa.parse(CSV_URL,{

download:true,
header:true,
skipEmptyLines:true,

complete:function(result){

let count=0;
let bounds=[];

result.data.forEach(row=>{

const id=String(row.TerritoryID)
.trim()
.toUpperCase();

if(territoryID&&id!==territoryID)return;

const p=row.Coordinates
.replace(/"/g,"")
.split(",");

if(p.length!=2)return;

const lat=parseFloat(p[0]);
const lng=parseFloat(p[1]);

count++;

const marker=L.marker(
[lat,lng],
{
icon:createIcon(
count,
visited.has(row.PeopleID)
?"visited":""
)
}
).addTo(map);

const house={

id:row.PeopleID,
number:count,
lat,
lng,
marker

};

houses.push(house);

marker.bindPopup(()=>`

<b>${count}. ${row["Full Name"]}</b><br>

${row.Address}<br><br>

<button class="popup-btn"

onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}')">

Navigate

</button>

<br>

<button class="popup-btn gray"

onclick="visitHouse('${row.PeopleID}')">

${visited.has(row.PeopleID)?"Visited ✓":"Mark Visited"}

</button>

`);

bounds.push([lat,lng]);

});

territoryBounds=L.latLngBounds(bounds);

map.fitBounds(territoryBounds,{
padding:[40,40]
});

updateStatus();

}

});

// ================= VISITED =================

window.visitHouse=function(id){

visited.add(id);

saveVisited();

houses.forEach(h=>{

if(h.id==id)
h.marker.setIcon(
createIcon(h.number,"visited")
);

});

highlightNearest();

updateStatus();

};

// ================= STATUS =================

function updateStatus(){

document.getElementById("status").innerHTML=`

Territory ${territoryNumber||"All"}<br>

${visited.size}/${houses.length} Visited

`;

}

// ================= BUTTONS =================

document.getElementById("territoryBtn").onclick=()=>{

follow=false;

followBtn.style.display="block";

map.fitBounds(territoryBounds,{
padding:[40,40]
});

};

document.getElementById("nextBtn").onclick=()=>{

highlightNearest();

};

</script>

</body>
</html>
