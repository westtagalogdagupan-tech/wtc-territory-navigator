<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>WTC Territory Navigator</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<style>
html,body,#map{
height:100%;
margin:0;
font-family:Arial,sans-serif;
}

#status{
position:absolute;
top:14px;
left:50%;
transform:translateX(-50%);
z-index:1000;
background:white;
padding:12px 18px;
border-radius:14px;
box-shadow:0 3px 12px rgba(0,0,0,.25);
font-weight:bold;
text-align:center;
line-height:1.3;
}

.fab{
position:absolute;
right:16px;
width:58px;
height:58px;
border:none;
border-radius:50%;
background:#2563EB;
color:white;
font-size:24px;
cursor:pointer;
box-shadow:0 4px 12px rgba(0,0,0,.35);
z-index:1000;
}

#followBtn{bottom:90px;display:none;}
#nextBtn{bottom:160px;}
#territoryBtn{bottom:230px;}

.house{
width:30px;
height:30px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-weight:bold;
border:2px solid white;
box-shadow:0 2px 8px rgba(0,0,0,.35);
background:#DC2626;
}

.target{background:#16A34A;}
.visited{background:#6B7280;}

.popup-btn{
margin-top:8px;
padding:10px;
width:100%;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.popup-btn.blue{background:#2563EB;color:white;}
.popup-btn.gray{background:#4B5563;color:white;}
</style>
</head>

<body>

<div id="map"></div>

<div id="status">Loading territory...</div>

<button id="territoryBtn" class="fab">🏠</button>
<button id="nextBtn" class="fab">➡️</button>
<button id="followBtn" class="fab">📍</button>

<script>

//================ CONFIG ================

const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSb2166VYuLVnakRbv1zBaA_GT5WhZhRpMRELIzktsQBUDSPY8J_2u0BJMJKyjy9XBGnZaNm_Iotlxu/pub?gid=150380614&single=true&output=csv";

const APP_ID="b471d87c-5f27-4245-9704-8c86379428fc";

const params=new URLSearchParams(location.search);
const territory=params.get("territory");
const territoryID=territory?`T${String(territory).padStart(3,"0")}`:null;

//================ MAP ================

const map=L.map("map").setView([16.043,120.334],14);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:20,
attribution:"© OpenStreetMap"
}
).addTo(map);

//================ GPS ================

let userMarker;
let accuracyCircle;
let lastLocation;
let follow=true;

const followBtn=document.getElementById("followBtn");

map.on("dragstart",()=>{
follow=false;
followBtn.style.display="block";
});

followBtn.onclick=()=>{
follow=true;
followBtn.style.display="none";
if(lastLocation) map.flyTo(lastLocation,18);
};

map.locate({
watch:true,
enableHighAccuracy:true,
maximumAge:0
});

map.on("locationfound",e=>{

lastLocation=e.latlng;

if(!userMarker){

userMarker=L.circleMarker(e.latlng,{
radius:8,
color:"#2563EB",
fillColor:"#2563EB",
fillOpacity:1
}).addTo(map);

accuracyCircle=L.circle(e.latlng,{
radius:e.accuracy,
color:"#2563EB",
fillOpacity:.12,
weight:1
}).addTo(map);

}else{

userMarker.setLatLng(e.latlng);
accuracyCircle.setLatLng(e.latlng);
accuracyCircle.setRadius(e.accuracy);

}

if(follow){
map.flyTo(e.latlng,18,{duration:.5});
}

highlightNearest();

});

//================ DATA ================

let houses=[];
let current=0;
let bounds;

//================ VISITED ================

function visitedKey(){
return `visited_${territoryID}`;
}

function getVisited(){
return JSON.parse(localStorage.getItem(visitedKey())||"[]");
}

function saveVisited(list){
localStorage.setItem(visitedKey(),JSON.stringify(list));
}

function updateStatus(){

const visited=getVisited().length;

document.getElementById("status").innerHTML=`
Territory ${territory}
<br>
${visited}/${houses.length} Visited
`;

}

//================ ICON ================

function createIcon(number,state=""){

return L.divIcon({
className:"",
html:`<div class="house ${state}">${number}</div>`,
iconSize:[30,30],
iconAnchor:[15,15]
});

}

//================ DISTANCE ================

function distance(a,b,c,d){

const R=6371000;

const dLat=(c-a)*Math.PI/180;
const dLon=(d-b)*Math.PI/180;

const x=
Math.sin(dLat/2)**2+
Math.cos(a*Math.PI/180)*
Math.cos(c*Math.PI/180)*
Math.sin(dLon/2)**2;

return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));

}

//================ NEAREST HOUSE ================

function highlightNearest(){

if(!lastLocation||!houses.length)return;

const visited=getVisited();

let best=-1;
let bestDist=Infinity;

houses.forEach((h,i)=>{

let state="";

if(visited.includes(h.id)) state="visited";

h.marker.setIcon(createIcon(h.number,state));

const d=distance(lastLocation.lat,lastLocation.lng,h.lat,h.lng);

if(!visited.includes(h.id)&&d<bestDist){

best=i;
bestDist=d;

}

});

if(best>=0){

houses[best].marker.setIcon(createIcon(houses[best].number,"target"));
current=best;

}

}

//================ MARK VISITED ================

function markVisited(id){

let visited=getVisited();

if(!visited.includes(id)){

visited.push(id);
saveVisited(visited);

}

updateStatus();
highlightNearest();

}

//================ LOAD CSV ================

Papa.parse(CSV_URL,{
download:true,
header:true,
skipEmptyLines:true,

complete:function(result){

let count=0;
let list=[];

result.data.forEach(row=>{

const tid=String(row.TerritoryID||"").trim().toUpperCase();

if(territoryID&&tid!==territoryID)return;

const coord=String(row.Coordinates||"").replace(/"/g,"").trim();

const p=coord.split(",");

if(p.length!==2)return;

const lat=parseFloat(p[0]);
const lng=parseFloat(p[1]);

if(isNaN(lat)||isNaN(lng))return;

count++;

const marker=L.marker([lat,lng],{
icon:createIcon(count)
}).addTo(map);

const appLink=
`https://www.appsheet.com/start/${APP_ID}#control=People_Detail&row=${row.PeopleID}`;

marker.bindPopup(`
<b>${count}. ${row["Full Name"]}</b><br>
${row.Address}<br>

<button class="popup-btn blue"
onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}','_blank')">
🧭 Navigate
</button>

<button class="popup-btn gray"
onclick="
markVisited('${row.PeopleID}');
window.location.assign('${appLink}');
">
✅ Arrived
</button>
`);

houses.push({
id:row.PeopleID,
number:count,
lat,
lng,
marker
});

list.push([lat,lng]);

});

if(list.length){

bounds=L.latLngBounds(list);

map.fitBounds(bounds,{padding:[40,40]});

}

updateStatus();
highlightNearest();

}

});

//================ BUTTONS ================

document.getElementById("territoryBtn").onclick=()=>{

follow=false;
followBtn.style.display="block";

if(bounds)
map.fitBounds(bounds,{padding:[40,40]});

};

document.getElementById("nextBtn").onclick=()=>{

if(!houses.length)return;

current=(current+1)%houses.length;

const h=houses[current];

follow=false;
followBtn.style.display="block";

map.flyTo([h.lat,h.lng],19);

h.marker.openPopup();

};

</script>

</body>
</html>
