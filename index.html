<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>WTC Territory Navigator</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

html,body,#map{
height:100%;
margin:0;
}

#map{
background:#f5f5f5;
}

.top-card{

position:absolute;
top:12px;
left:60px;
z-index:999;

background:white;
padding:10px 14px;
border-radius:12px;
font-family:Arial;
font-weight:bold;
box-shadow:0 2px 10px rgba(0,0,0,.25);

}

.right-buttons{

position:absolute;
right:12px;
bottom:22px;
z-index:999;

display:flex;
flex-direction:column;
gap:10px;

}

.fab{

width:54px;
height:54px;
border-radius:50%;
border:none;
background:#2563EB;
color:white;
font-size:24px;
cursor:pointer;
box-shadow:0 4px 10px rgba(0,0,0,.35);

}

.popup-btn{

width:100%;
padding:10px;
margin-top:8px;

border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;

}

.blue{

background:#2563EB;
color:white;

}

.gray{

background:#444;
color:white;

}

.green{

background:#16A34A;
color:white;

}

</style>

</head>

<body>

<div id="map"></div>

<div class="top-card" id="territoryCard">
Loading...
</div>

<div class="right-buttons">

<button class="fab" onclick="goHome()">🏠</button>

<button class="fab" onclick="toggleFollow()" id="followBtn">
📍
</button>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const params=new URLSearchParams(location.search);

const territory=params.get("territory");
const person=params.get("person");

const map=L.map("map",{zoomControl:true});

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:20
}
).addTo(map);

let markers=[];
let lastLocation=null;
let followUser=true;
let userMarker=null;
let accuracyCircle=null;
let nearestMarker=null;

const CSV_URL="YOUR_CSV_URL_HERE";

function distance(lat1,lon1,lat2,lon2){

const R=6371000;

const dLat=(lat2-lat1)*Math.PI/180;
const dLon=(lon2-lon1)*Math.PI/180;

const a=Math.sin(dLat/2)**2+
Math.cos(lat1*Math.PI/180)*
Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)**2;

return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));

}

function goHome(){

if(lastLocation){

map.flyTo(
[lastLocation.lat,lastLocation.lng],
18
);

}

}

function toggleFollow(){

followUser=!followUser;

document.getElementById("followBtn").innerHTML=
followUser?"📍":"🧭";

}

function highlightNearestHouse(){

if(!lastLocation)return;

let nearest=null;
let best=999999;

markers.forEach(m=>{

const d=distance(
lastLocation.lat,
lastLocation.lng,
m.lat,
m.lng
);

if(d<best){

best=d;
nearest=m;

}

});

if(nearestMarker){

nearestMarker.setStyle({
fillColor:"#DC2626"
});

}

if(nearest){

nearest.marker.setStyle({
fillColor:"#16A34A"
});

nearestMarker=nearest.marker;

}

}

function startGPS(){

navigator.geolocation.watchPosition(

p=>{

lastLocation={

lat:p.coords.latitude,
lng:p.coords.longitude

};

const pos=[lastLocation.lat,lastLocation.lng];

if(!userMarker){

userMarker=L.circleMarker(pos,{
radius:8,
color:"#fff",
weight:2,
fillColor:"#2563EB",
fillOpacity:1
}).addTo(map);

accuracyCircle=L.circle(pos,{
radius:p.coords.accuracy,
color:"#2563EB",
fillOpacity:.15
}).addTo(map);

map.setView(pos,18);

}else{

userMarker.setLatLng(pos);

accuracyCircle.setLatLng(pos);
accuracyCircle.setRadius(p.coords.accuracy);

if(followUser){

map.panTo(pos);

}

}

highlightNearestHouse();

},

e=>console.log(e),

{

enableHighAccuracy:true,
maximumAge:0,
timeout:10000

}

);

}

async function loadData(){

const text=await fetch(CSV_URL).then(r=>r.text());

const rows=text.trim().split("\n");

const head=rows.shift().split(",");

let total=0;
let visited=0;

rows.forEach(r=>{

const c=r.split(",");

const row={};

head.forEach((h,i)=>row[h]=c[i]);

if(territory&&String(row.TerritoryNumber)!=territory)return;

const lat=parseFloat(row.Latitude);
const lng=parseFloat(row.Longitude);

if(isNaN(lat)||isNaN(lng))return;

total++;

if(row.Visited==="TRUE")visited++;

const marker=L.circleMarker([lat,lng],{

radius:8,
fillColor:"#DC2626",
fillOpacity:1,
color:"#fff",
weight:2

}).addTo(map);

markers.push({

marker,
lat,
lng

});

const appLink=row.AppLink||"#";

marker.bindPopup(`
<b>${row.HouseNumber}. ${row["Full Name"]}</b><br>
${row.Address}<br>

<button class="popup-btn blue"
onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}','_blank')">
Navigate
</button>

<button class="popup-btn gray"
onclick="
location.replace('${appLink}');
">
Arrived
</button>
`);

if(person&&row.PeopleID===person){

marker.openPopup();

map.setView([lat,lng],19);

}

});

document.getElementById("territoryCard").innerHTML=
`Territory ${territory||"-"}<br>${visited}/${total} Visited`;

if(markers.length&&!person){

const g=L.featureGroup(markers.map(m=>m.marker));

map.fitBounds(g.getBounds(),{padding:[40,40]});

}

}

loadData();

startGPS();

</script>

</body>
</html>
