<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WTC Territory Navigator</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<style>
html,body,#map{height:100%;margin:0;font-family:Arial,sans-serif;}
#map{background:#f5f5f5;}

#status{
position:absolute;
top:12px;
left:50%;
transform:translateX(-50%);
z-index:1000;
background:white;
padding:10px 16px;
border-radius:14px;
box-shadow:0 3px 12px rgba(0,0,0,.25);
font-weight:bold;
text-align:center;
line-height:1.3;
}

.right-buttons{
position:absolute;
right:12px;
bottom:22px;
z-index:1000;
display:flex;
flex-direction:column;
gap:10px;
}

.fab{
width:54px;
height:54px;
border-radius:50%;
border:none;
background:#2563EB;
color:white;
font-size:24px;
cursor:pointer;
box-shadow:0 4px 12px rgba(0,0,0,.35);
}

.house{
width:30px;
height:30px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-weight:bold;
border:2px solid white;
box-shadow:0 2px 8px rgba(0,0,0,.35);
background:#DC2626;
}

.target{background:#16A34A;}
.visited{background:#6B7280;}

.popup-btn{
display:block;
margin-top:8px;
padding:10px;
width:100%;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
text-decoration:none;
text-align:center;
box-sizing:border-box;
}

.blue{background:#2563EB;color:white;}
.gray{background:#4B5563;color:white;}
</style>
</head>

<body>

<div id="map"></div>

<div id="status">Loading territory...</div>

<div class="right-buttons">
<button class="fab" onclick="goHome()">🏠</button>
<button class="fab" onclick="toggleFollow()" id="followBtn">📍</button>
</div>

<script>

//================ CONFIG ================

const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSb2166VYuLVnakRbv1zBaA_GT5WhZhRpMRELIzktsQBUDSPY8J_2u0BJMJKyjy9XBGnZaNm_Iotlxu/pub?gid=150380614&single=true&output=csv";

const params=new URLSearchParams(location.search);
const territory=params.get("territory");
const person=params.get("person");

const territoryID=territory
?`T${String(territory).padStart(3,"0")}`
:null;

//================ MAP ================

const map=L.map("map").setView([16.043,120.334],14);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:20,
attribution:"© OpenStreetMap"
}
).addTo(map);

//================ GPS ================

let followUser=true;
let lastLocation=null;
let userMarker=null;
let accuracyCircle=null;

function startLiveGPS(){

if(!navigator.geolocation){

alert("GPS not supported.");

return;

}

navigator.geolocation.watchPosition(

(position)=>{

const lat=position.coords.latitude;
const lng=position.coords.longitude;
const accuracy=position.coords.accuracy;

lastLocation={lat,lng};

const pos=[lat,lng];

if(!userMarker){

userMarker=L.circleMarker(pos,{
radius:8,
color:"#fff",
weight:2,
fillColor:"#2563EB",
fillOpacity:1
}).addTo(map);

accuracyCircle=L.circle(pos,{
radius:accuracy,
color:"#2563EB",
fillOpacity:.15,
weight:1
}).addTo(map);

map.setView(pos,18);

}else{

userMarker.setLatLng(pos);

accuracyCircle.setLatLng(pos);
accuracyCircle.setRadius(accuracy);

if(followUser){

map.panTo(pos,{animate:true});

}

}

highlightNearest();

},

(err)=>console.log(err),

{
enableHighAccuracy:true,
maximumAge:0,
timeout:10000
}

);

}

function goHome(){

if(lastLocation){

map.flyTo(
[lastLocation.lat,lastLocation.lng],
18
);

}

}

function toggleFollow(){

followUser=!followUser;

document.getElementById("followBtn").innerHTML=
followUser?"📍":"🧭";

if(followUser&&lastLocation){

goHome();

}

}

//================ DATA ================

let houses=[];
let current=0;
let bounds;

//================ VISITED ================

function visitedKey(){

return `visited_${territoryID}`;

}

function getVisited(){

return JSON.parse(
localStorage.getItem(visitedKey())||"[]"
);

}

function saveVisited(v){

localStorage.setItem(
visitedKey(),
JSON.stringify(v)
);

}

function markVisited(id){

const v=getVisited();

if(!v.includes(id)){

v.push(id);

saveVisited(v);

}

updateStatus();
highlightNearest();

}

//================ STATUS ================

function updateStatus(){

document.getElementById("status").innerHTML=
`Territory ${territory}<br>${getVisited().length}/${houses.length} Visited`;

}

//================ MARKERS ================

function markerIcon(num,state=""){

return L.divIcon({

className:"",

html:`<div class="house ${state}">${num}</div>`,

iconSize:[30,30],
iconAnchor:[15,15]

});

}

//================ DISTANCE ================

function distance(a,b,c,d){

const R=6371000;

const dLat=(c-a)*Math.PI/180;
const dLon=(d-b)*Math.PI/180;

const x=
Math.sin(dLat/2)**2+
Math.cos(a*Math.PI/180)*
Math.cos(c*Math.PI/180)*
Math.sin(dLon/2)**2;

return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));

}

//================ NEAREST ================

function highlightNearest(){

if(!lastLocation)return;

const visited=getVisited();

let best=-1;
let bestDist=Infinity;

houses.forEach((h,i)=>{

const state=visited.includes(h.id)
?"visited":"";

h.marker.setIcon(
markerIcon(h.number,state)
);

const d=distance(
lastLocation.lat,
lastLocation.lng,
h.lat,
h.lng
);

if(!visited.includes(h.id)&&d<bestDist){

best=i;
bestDist=d;

}

});

if(best>=0){

houses[best].marker.setIcon(
markerIcon(houses[best].number,"target")
);

current=best;

}

}

//================ LOAD CSV ================

Papa.parse(CSV_URL,{

download:true,
header:true,
skipEmptyLines:true,

complete:(res)=>{

let count=0;
let pts=[];

res.data.forEach(row=>{

const tid=String(row.TerritoryID||"")
.trim()
.toUpperCase();

if(territoryID&&tid!==territoryID)return;

const coord=String(row.Coordinates||"")
.replace(/"/g,"")
.trim()
.split(",");

if(coord.length!==2)return;

const lat=parseFloat(coord[0]);
const lng=parseFloat(coord[1]);

if(isNaN(lat)||isNaN(lng))return;

count++;

const marker=L.marker(
[lat,lng],
{
icon:markerIcon(count)
}
).addTo(map);

const appLink=row.AppLink||"#";

marker.bindPopup(`
<b>${count}. ${row["Full Name"]}</b><br>
${row.Address}<br>

<a href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}"
target="_blank"
class="popup-btn blue">
🧭 Navigate
</a>

<button class="popup-btn gray"
onclick="
markVisited('${row.PeopleID}');
location.replace('${appLink}');
">
✅ Arrived
</button>
`);

houses.push({

id:row.PeopleID,
number:count,
lat,
lng,
marker

});

pts.push([lat,lng]);

if(person&&row.PeopleID===person){

marker.openPopup();

map.setView([lat,lng],19);

}

});

if(pts.length){

bounds=L.latLngBounds(pts);

if(!person){

map.fitBounds(bounds,{padding:[40,40]});

}

}

updateStatus();

startLiveGPS();

}

});

//================ NEXT HOUSE ================

function nextHouse(){

if(!houses.length)return;

current=(current+1)%houses.length;

const h=houses[current];

map.flyTo([h.lat,h.lng],19);

h.marker.openPopup();

}

</script>

</body>
</html>
