<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WTC Territory Navigator</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<style>
html, body {
  margin: 0;
  height: 100%;
}

#map {
  width: 100%;
  height: 100%;
}

#status {
  position: absolute;
  top: 12px;
  left: 55px;
  z-index: 1000;
  background: white;
  padding: 10px 14px;
  border-radius: 10px;
  font-family: Arial, sans-serif;
  font-size: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,.25);
}
</style>
</head>
<body>

<div id="map"></div>
<div id="status">Loading territory...</div>

<script>
// ----------------------------
// CONFIG
// ----------------------------
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSb2166VYuLVnakRbv1zBaA_GT5WhZhRpMRELIzktsQBUDSPY8J_2u0BJMJKyjy9XBGnZaNm_Iotlxu/pub?gid=150380614&single=true&output=csv";

// ----------------------------
// GET TERRITORY FROM URL
// ----------------------------
const params = new URLSearchParams(window.location.search);
const territoryNumber = params.get("territory");
const territoryID = territoryNumber
  ? "T" + territoryNumber.padStart(3,"0")
  : null;

// ----------------------------
// MAP
// ----------------------------
const map = L.map("map").setView([16.043,120.334],13);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution:"© OpenStreetMap"
  }
).addTo(map);

// ----------------------------
// LIVE LOCATION (FIXED)
// ----------------------------
let myMarker = null;

if (navigator.geolocation) {
  navigator.geolocation.watchPosition(
    function(pos){

      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;

      if(myMarker){
        myMarker.setLatLng([lat,lng]);
      }else{
        myMarker = L.circleMarker([lat,lng],{
          radius:8,
          color:"#2563EB",
          fillColor:"#2563EB",
          fillOpacity:1
        }).addTo(map);
      }

    },
    function(err){
      console.log("Location error:", err);
    },
    {
      enableHighAccuracy:true,
      maximumAge:0,
      timeout:10000
    }
  );
}

// ----------------------------
// LOAD PEOPLE
// ----------------------------
Papa.parse(CSV_URL,{
  download:true,
  header:true,
  skipEmptyLines:true,

  complete:function(result){

    let bounds=[];
    let count=0;

    result.data.forEach(row=>{

      if(territoryID && row.TerritoryID.trim()!=territoryID) return;

      const coord=(row.Coordinates||"").split(",");

      if(coord.length!==2) return;

      const lat=parseFloat(coord[0]);
      const lng=parseFloat(coord[1]);

      if(isNaN(lat)||isNaN(lng)) return;

      count++;
      bounds.push([lat,lng]);

      L.circleMarker([lat,lng],{
        radius:5,
        color:"#DC2626",
        fillColor:"#DC2626",
        fillOpacity:1
      })
      .addTo(map)
      .bindPopup(
        `<b>${row["Full Name"]}</b><br>${row.Address}`
      );

    });

    if(count>0){

      map.fitBounds(bounds,{padding:[40,40]});

      document.getElementById("status").innerHTML =
        `Territory ${territoryNumber} • ${count} houses`;

    }else{

      document.getElementById("status").innerHTML =
        territoryID
        ? `No houses found for ${territoryID}`
        : "Showing all houses";

    }

  },

  error:function(err){

    console.error(err);

    document.getElementById("status").innerHTML =
      "Failed to load Google Sheet.";

  }

});
</script>

</body>
</html>
