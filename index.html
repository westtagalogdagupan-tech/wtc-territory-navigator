<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WTC Territory Navigator</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body{
  margin:0;
  height:100%;
}
#map{
  width:100%;
  height:100vh;
}
.info{
  position:absolute;
  top:10px;
  left:10px;
  z-index:1000;
  background:white;
  padding:10px 14px;
  border-radius:12px;
  font-family:Arial;
  box-shadow:0 2px 10px rgba(0,0,0,.2);
}
</style>
</head>

<body>

<div class="info" id="title">Loading territory...</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map=L.map("map").setView([16.265852,120.409395],16);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{attribution:"© OpenStreetMap"}
).addTo(map);

// Live GPS
let myMarker=null;

navigator.geolocation.watchPosition(
function(pos){
const lat=pos.coords.latitude;
const lng=pos.coords.longitude;

if(myMarker){
myMarker.setLatLng([lat,lng]);
}else{
myMarker=L.circleMarker([lat,lng],{
radius:8,
color:"#2563EB",
fillColor:"#2563EB",
fillOpacity:1
}).addTo(map);
}
},
function(){},
{
enableHighAccuracy:true,
maximumAge:0,
timeout:10000
}
);

// Selected territory from AppSheet
const params=new URLSearchParams(window.location.search);
const selected=params.get("territory");

// Load PEOPLE CSV
fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vSb2166VYuLVnakRbv1zBaA_GT5WhZhRpMRELIzktsQBUDSPY8J_2u0BJMJKyjy9XBGnZaNm_Iotlxu/pub?gid=150380614&single=true&output=csv")
.then(r=>r.text())
.then(text=>{

const rows=text.trim().split("\n").map(r=>r.split(","));
const header=rows.shift();

const territoryIndex=header.indexOf("TerritoryID");
const nameIndex=header.indexOf("Full Name");
const coordIndex=header.indexOf("Coordinates");

const bounds=[];

rows.forEach(r=>{

if(r[territoryIndex]==selected){

const coord=r[coordIndex];
if(!coord) return;

const parts=coord.split(",");

const lat=parseFloat(parts[0]);
const lng=parseFloat(parts[1]);

if(isNaN(lat)||isNaN(lng)) return;

bounds.push([lat,lng]);

L.circleMarker([lat,lng],{
radius:5,
color:"#16A34A",
fillColor:"#16A34A",
fillOpacity:1
})
.bindPopup(r[nameIndex])
.addTo(map);

}
});

document.getElementById("title").innerHTML="📍 Territory "+selected;

if(bounds.length){
map.fitBounds(bounds,{padding:[40,40]});
}else{
document.getElementById("title").innerHTML="⚠ No houses found for Territory "+selected;
}

});
</script>

</body>
</html>
