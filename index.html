<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WTC Territory Navigator</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<style>
html,body,#map{height:100%;margin:0;}
.info{
position:absolute;
top:12px;
left:50px;
z-index:1000;
background:white;
padding:10px 14px;
border-radius:10px;
font-family:Arial,sans-serif;
box-shadow:0 2px 8px rgba(0,0,0,.25);
}
</style>
</head>
<body>

<div id="map"></div>
<div class="info" id="status">Loading territory...</div>

<script>
const params = new URLSearchParams(window.location.search);
const territoryNumber = params.get("territory");
const territoryID = territoryNumber ? "T" + territoryNumber.padStart(3,"0") : null;

const map = L.map("map").setView([16.04,120.33],14);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  attribution:"© OpenStreetMap"
}).addTo(map);

// ✅ Fixed geolocation
let myMarker = null;

if (navigator.geolocation) {
  navigator.geolocation.watchPosition(
    function(pos){
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;

      if(myMarker){
        myMarker.setLatLng([lat,lng]);
      }else{
        myMarker = L.circleMarker([lat,lng],{
          radius:8,
          color:"#2563EB",
          fillColor:"#2563EB",
          fillOpacity:1
        }).addTo(map);
      }
    },
    function(err){
      console.log("Location unavailable", err);
    },
    {
      enableHighAccuracy:true,
      maximumAge:0
    }
  );
}

const csvURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSb2166VYuLVnakRbv1zBaA_GT5WhZhRpMRELIzktsQBUDSPY8J_2u0BJMJKyjy9XBGnZaNm_Iotlxu/pub?gid=150380614&single=true&output=csv";

Papa.parse(csvURL,{
  download:true,
  header:true,
  skipEmptyLines:true,
  complete:function(result){

    console.log("Territory:", territoryID);
    console.log("Rows:", result.data.length);

    let bounds=[];
    let count=0;

    result.data.forEach(row=>{

      if(territoryID && row.TerritoryID.trim()!==territoryID) return;

      const coord=(row.Coordinates||"").split(",");
      if(coord.length!==2) return;

      const lat=parseFloat(coord[0]);
      const lng=parseFloat(coord[1]);
      if(isNaN(lat)||isNaN(lng)) return;

      count++;
      bounds.push([lat,lng]);

      L.circleMarker([lat,lng],{
        radius:5,
        color:"#DC2626",
        fillColor:"#DC2626",
        fillOpacity:1
      }).addTo(map)
      .bindPopup("<b>"+row["Full Name"]+"</b><br>"+row.Address);
    });

    if(count){
      map.fitBounds(bounds,{padding:[40,40]});
      document.getElementById("status").innerHTML =
        "Territory "+territoryNumber+" • "+count+" houses";
    }else{
      document.getElementById("status").innerHTML =
        "No houses found for "+territoryID;
    }
  },
  error:function(err){
    document.getElementById("status").innerHTML="CSV failed";
    console.error(err);
  }
});
</script>

</body>
</html>
