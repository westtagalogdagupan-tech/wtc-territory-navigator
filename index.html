<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WTC Territory Navigator</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html,body,#map{
    height:100%;
    margin:0;
}

#banner{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    background:white;
    padding:10px 16px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
    font-family:Arial,Helvetica,sans-serif;
    font-weight:bold;
    z-index:1000;
}
</style>

</head>

<body>

<div id="banner">Loading Territory...</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// Create map
const map=L.map('map').setView([16.265852,120.409395],17);

// OpenStreetMap tiles
L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);


// ---------------------------
// Read Territory from AppSheet
// ---------------------------

const params=new URLSearchParams(window.location.search);
const territory=params.get("territory") || "Unknown Territory";

document.getElementById("banner").innerHTML=
"📍 "+territory;

console.log("Selected Territory:",territory);


// ---------------------------
// Live GPS
// ---------------------------

let myMarker=null;

navigator.geolocation.watchPosition(

function(pos){

const lat=pos.coords.latitude;
const lng=pos.coords.longitude;

if(myMarker){

myMarker.setLatLng([lat,lng]);

}else{

myMarker=L.circleMarker(
[lat,lng],
{
radius:9,
color:"#2563EB",
fillColor:"#2563EB",
fillOpacity:1
}).addTo(map);

myMarker.bindPopup("📍 Your Current Location");

}

map.setView([lat,lng]);

},

function(err){

alert("Please allow location access.");

},

{
enableHighAccuracy:true,
maximumAge:0,
timeout:10000
}

);

</script>

</body>
</html>
