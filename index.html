<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WTC Territory Navigator</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body{
margin:0;
height:100%;
font-family:Arial,sans-serif;
}
#map{
height:100vh;
width:100%;
}
.info{
position:absolute;
top:12px;
left:12px;
z-index:1000;
background:white;
padding:10px 14px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.25);
font-weight:bold;
}
</style>
</head>

<body>

<div class="info" id="title">Loading territory...</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map=L.map("map").setView([16.265852,120.409395],16);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
attribution:"© OpenStreetMap"
}
).addTo(map);

let myMarker=null;

// LIVE GPS
navigator.geolocation.watchPosition(

function(pos){

const lat=pos.coords.latitude;
const lng=pos.coords.longitude;

if(myMarker){

myMarker.setLatLng([lat,lng]);

}else{

myMarker=L.circleMarker(
[lat,lng],
{
radius:8,
color:"#2563EB",
fillColor:"#2563EB",
fillOpacity:1
}
).addTo(map);

}

},

function(err){

console.log(err);

},

{
enableHighAccuracy:true,
maximumAge:0,
timeout:10000
}

);

// READ TERRITORY FROM URL
const params=new URLSearchParams(window.location.search);
const territoryNumber=params.get("territory")||"1";
const selected="T"+territoryNumber.padStart(3,"0");

document.getElementById("title").innerHTML="📍 Territory "+territoryNumber;

// LOAD PEOPLE CSV
fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vSb2166VYuLVnakRbv1zBaA_GT5WhZhRpMRELIzktsQBUDSPY8J_2u0BJMJKyjy9XBGnZaNm_Iotlxu/pub?gid=150380614&single=true&output=csv")

.then(r=>r.text())

.then(text=>{

const rows=text.trim().split(/\r?\n/).map(r=>r.split(","));

const header=rows.shift().map(h=>h.trim());

const territoryIndex=header.indexOf("TerritoryID");
const nameIndex=header.indexOf("Full Name");
const coordIndex=header.indexOf("Coordinates");

console.log(header);

const bounds=[];

rows.forEach(r=>{

if((r[territoryIndex]||"").trim()===selected){

const coord=(r[coordIndex]||"").replace(/"/g,"").trim();

const parts=coord.split(",");

if(parts.length!==2)return;

const lat=parseFloat(parts[0]);
const lng=parseFloat(parts[1]);

if(isNaN(lat)||isNaN(lng))return;

bounds.push([lat,lng]);

L.circleMarker(
[lat,lng],
{
radius:5,
color:"#16A34A",
fillColor:"#16A34A",
fillOpacity:1
}
)
.bindPopup("<b>"+(r[nameIndex]||"House")+"</b>")
.addTo(map);

}

});

if(bounds.length){

map.fitBounds(bounds,{padding:[40,40]});

}else{

document.getElementById("title").innerHTML=
"⚠ No houses found for Territory "+territoryNumber;

}

})

.catch(err=>{

console.error(err);

document.getElementById("title").innerHTML="Error loading data";

});

</script>

</body>
</html>
