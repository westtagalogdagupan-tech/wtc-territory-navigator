<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>WTC Territory Navigator</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html,body,#map{
height:100%;
margin:0;
}
.info{
position:absolute;
top:12px;
left:50px;
z-index:1000;
background:white;
padding:10px 14px;
border-radius:10px;
font-family:Arial,sans-serif;
font-size:16px;
box-shadow:0 2px 8px rgba(0,0,0,.25);
}
</style>
</head>

<body>

<div id="map"></div>
<div class="info" id="status">Loading territory...</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const params=new URLSearchParams(location.search);
const territoryNumber=params.get("territory");

const territoryID=territoryNumber
? "T"+territoryNumber.toString().padStart(3,"0")
: null;

const map=L.map("map").setView([16.04,120.33],15);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
attribution:"© OpenStreetMap"
}
).addTo(map);

let myMarker;

navigator.geolocation.watchPosition(function(pos){

const lat=pos.coords.latitude;
const lng=pos.coords.longitude;

if(myMarker){
myMarker.setLatLng([lat,lng]);
}else{
myMarker=L.circleMarker([lat,lng],{
radius:8,
color:"#2563EB",
fillColor:"#2563EB",
fillOpacity:1
}).addTo(map);
}

},{},{

enableHighAccuracy:true,
maximumAge:0

});

const csvURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSb2166VYuLVnakRbv1zBaA_GT5WhZhRpMRELIzktsQBUDSPY8J_2u0BJMJKyjy9XBGnZaNm_Iotlxu/pub?gid=150380614&single=true&output=csv";

fetch(csvURL)
.then(r=>r.text())
.then(text=>{

const rows=text.trim().split("\n").map(r=>r.split(","));

const header=rows.shift();

const latIndex=header.indexOf("Coordinates");
const territoryIndex=header.indexOf("TerritoryID");
const nameIndex=header.indexOf("Full Name");
const addressIndex=header.indexOf("Address");

let bounds=[];

rows.forEach(r=>{

if(r[territoryIndex]!==territoryID)return;

const coord=r[latIndex];

if(!coord)return;

const p=coord.split(",");

if(p.length!==2)return;

const lat=parseFloat(p[0]);
const lng=parseFloat(p[1]);

bounds.push([lat,lng]);

L.circleMarker([lat,lng],{
radius:5,
color:"#DC2626",
fillColor:"#DC2626",
fillOpacity:1
})
.addTo(map)
.bindPopup(
"<b>"+r[nameIndex]+"</b><br>"+r[addressIndex]
);

});

if(bounds.length){

map.fitBounds(bounds,{padding:[40,40]});

document.getElementById("status").innerHTML=
"Territory "+territoryNumber+
" • "+bounds.length+" houses";

}else{

document.getElementById("status").innerHTML=
"No houses found for Territory "+territoryNumber+
" ("+territoryID+")";

}

});

</script>

</body>
</html>
